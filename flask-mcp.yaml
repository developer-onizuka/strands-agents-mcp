apiVersion: v1
kind: Service
metadata:
  labels:
    app: flask-mcp
  name: svc-flask-mcp
  namespace: default
spec:
  type: LoadBalancer
  ports:
  - port: 8000
    targetPort: 5000
  selector:
    app: flask-mcp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: flask-mcp
  name: flask-mcp
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flask-mcp
  template:
    metadata:
      labels:
        app: flask-mcp
    spec:
      containers:
      - image: developeronizuka/flask-mcp:1.0.0
        imagePullPolicy: Always
        name: flask-mcp
        ports:
        - containerPort: 5000
