apiVersion: v1
kind: Pod
metadata:
  name: strands-agents
  labels:
    app: strands-agents
spec:
  containers:
  - name: strands-agents
    image: python:3.11-slim
    command: ["/bin/sh", "-c"]
    args:
      - |
        pip install strands-agents ollama strands-agents-tools && \
        sleep infinity
